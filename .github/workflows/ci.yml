name: Tests

on:
  push:
  pull_request:

# ANYmesher and ANYmaterial are real requirements of this package, but they are
# not on PyPI yet, so `pip install -e .` cannot resolve them.  Installing them
# from their repositories first satisfies the requirement; once both are
# published these two lines can go and pip will resolve them normally.
env:
  SIBLINGS: >-
    git+https://github.com/audunarn/ANYmaterial
    git+https://github.com/audunarn/ANYmesh

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ${{ env.SIBLINGS }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import anyfileio; print(anyfileio.__version__)"
      - run: python -m pytest

  # The record and document layers must stay usable with nothing but numpy, so
  # that inspecting a file never drags in a mesh library.  This job also asserts
  # the async `anyio` can coexist: it is a transitive dependency of very common
  # packages, and a shadowed import would surface here rather than in a user's
  # environment.
  coexists-with-anyio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ${{ env.SIBLINGS }}
      - run: python -m pip install -e ".[dev]" anyio
      - run: python -c "import anyio, anyfileio; print(anyio.__version__, anyfileio.__version__)"
      - run: python -c "import anyio; assert 'anyfileio' not in anyio.__file__"
      - run: python -m pytest

  # A wheel built from a clean checkout, installed on its own, importing without
  # the repository on sys.path.  Catches the packaging mistakes that an editable
  # install hides: a subpackage missing from the find directive, a fixture left
  # out of MANIFEST.in.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install ${{ env.SIBLINGS }}
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cd /tmp && python -c "import anyfileio; print(anyfileio.__version__)"
      - run: cd /tmp && anyfileio formats
