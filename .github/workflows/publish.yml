name: Publish ANYfileio to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must be 0.3.1)
        required: true
        default: "0.3.1"
        type: string
      publish:
        description: Publish the validated artifacts to PyPI
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    if: github.ref == 'refs/heads/main' && inputs.version == '0.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate source release contract
        shell: python
        run: |
          import re
          import json
          import tomllib
          from pathlib import Path

          version = "0.3.1"
          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          if project["version"] != version:
              raise SystemExit(f"expected release version {version}, received {project['version']!r}")
          if project["license"] != "MPL-2.0":
              raise SystemExit(f"unexpected license expression: {project['license']!r}")
          expected_license_files = {
              "LICENSE",
              "LICENSE-DOCS.md",
              "NOTICE",
              "THIRD_PARTY_NOTICES.md",
          }
          if set(project["license-files"]) != expected_license_files:
              raise SystemExit("project license-file inventory drifted")
          for relative in expected_license_files:
              if not Path(relative).is_file():
                  raise SystemExit(f"missing required notice: {relative}")

          init_text = Path("src/anyfileio/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if match is None or match.group(1) != version:
              raise SystemExit("pyproject.toml and anyfileio.__version__ disagree")
          if project.get("dependencies") != ["numpy>=1.26"]:
              raise SystemExit(f"unexpected runtime dependencies: {project.get('dependencies')!r}")
          dependency_licenses = json.loads(
              Path("dependency-licenses.json").read_text(encoding="utf-8")
          )
          if dependency_licenses.get("release") != "ANYfileio 0.3.1":
              raise SystemExit("dependency license inventory has the wrong release")
          if dependency_licenses.get("dependencies") != [
              {
                  "distribution": "numpy",
                  "requirement": "numpy>=1.26",
                  "license": "BSD-3-Clause",
                  "upstream": "https://numpy.org/",
                  "bundled": False,
              }
          ]:
              raise SystemExit("dependency license inventory drifted")
          extras = project.get("optional-dependencies", {})
          if set(extras) != {"dev", "gui"} or "semantics" in extras:
              raise SystemExit(f"unexpected release extras: {sorted(extras)!r}")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if "## 0.3.1 - 2026-09-03" not in changelog:
              raise SystemExit("CHANGELOG.md is missing the final 0.3.1 release heading")
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          python -m twine check dist/*
      - name: Inspect distribution contents and metadata
        shell: python
        run: |
          import email
          import tarfile
          import zipfile
          from pathlib import Path

          version = "0.3.1"
          expected = [
              f"anyfileio-{version}-py3-none-any.whl",
              f"anyfileio-{version}.tar.gz",
          ]
          actual = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          if actual != expected:
              raise SystemExit(f"unexpected distribution set: {actual!r}; expected {expected!r}")

          notices = {"LICENSE", "LICENSE-DOCS.md", "NOTICE", "THIRD_PARTY_NOTICES.md"}
          forbidden = ("anygeometry", "anymesher", "anymaterial", "ocp", "cadquery")
          with zipfile.ZipFile(Path("dist", expected[0])) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("wheel integrity check failed")
              names = archive.namelist()
              metadata_name, = [name for name in names if name.endswith(".dist-info/METADATA")]
              metadata = email.message_from_bytes(archive.read(metadata_name))
              if metadata["Name"] != "ANYfileio" or metadata["Version"] != version:
                  raise SystemExit("wheel metadata does not match the release contract")
              if metadata["License-Expression"] != "MPL-2.0":
                  raise SystemExit("wheel is missing the MPL-2.0 license expression")
              requirements = metadata.get_all("Requires-Dist", [])
              runtime = [item for item in requirements if "extra ==" not in item]
              if runtime != ["numpy>=1.26"]:
                  raise SystemExit(f"unexpected runtime requirements: {runtime!r}")
              if set(metadata.get_all("Provides-Extra", [])) != {"dev", "gui"}:
                  raise SystemExit("wheel extras drifted")
              flattened = "\n".join(requirements).lower()
              if any(name in flattened for name in forbidden):
                  raise SystemExit("wheel metadata contains a deferred owner/provider")
              license_names = {
                  Path(name).name
                  for name in names
                  if ".dist-info/licenses/" in name
              }
              if license_names != notices:
                  raise SystemExit(f"wheel notice inventory drifted: {sorted(license_names)!r}")
              if any(name.startswith(("OCP/", "cadquery/", "anyfileio_occt/")) for name in names):
                  raise SystemExit("wheel bundles a deferred native provider")
              entry_points_name, = [
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              ]
              entry_points = archive.read(entry_points_name).decode("utf-8")
              for expected_entry in (
                  "anyfileio = anyfileio.__main__:main",
                  "anyfileio-gui = anyfileio.gui:main",
              ):
                  if expected_entry not in entry_points:
                      raise SystemExit(f"wheel is missing entry point {expected_entry!r}")

          with tarfile.open(Path("dist", expected[1]), "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              root = f"anyfileio-{version}"
              package_info = archive.extractfile(members[f"{root}/PKG-INFO"])
              if package_info is None:
                  raise SystemExit("sdist is missing readable PKG-INFO")
              metadata = email.message_from_binary_file(package_info)
              if metadata["Name"] != "ANYfileio" or metadata["Version"] != version:
                  raise SystemExit("sdist metadata does not match the release contract")
              if metadata["License-Expression"] != "MPL-2.0":
                  raise SystemExit("sdist is missing the MPL-2.0 license expression")
              required = notices | {
                  "README.md",
                  "CHANGELOG.md",
                  "MIGRATION.md",
                  "dependency-licenses.json",
              }
              for relative in required:
                  if f"{root}/{relative}" not in members:
                      raise SystemExit(f"sdist is missing {relative}")
      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anyfileio-0.3.1-distributions
          path: |
            dist/anyfileio-0.3.1-py3-none-any.whl
            dist/anyfileio-0.3.1.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated distributions to PyPI
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ANYfileio
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: anyfileio-0.3.1-distributions
          path: dist
      - name: Require the exact publication set
        shell: python
        run: |
          from pathlib import Path

          expected = {
              "anyfileio-0.3.1-py3-none-any.whl",
              "anyfileio-0.3.1.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected publication set: {sorted(actual)!r}")
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
