name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  dependency-gate:
    name: Verify sibling releases on target index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Require compatible semantics-extra material and mesher packages
        env:
          TARGET_INDEX_URL: ${{ github.event_name == 'release' && 'https://pypi.org/simple' || 'https://test.pypi.org/simple' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip download --no-deps --dest sibling-distributions --index-url "$TARGET_INDEX_URL" "ANYmaterial>=0.1,<0.2" "ANYmesher>=0.2,<0.3"

  build:
    needs: dependency-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ANYfileio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ANYfileio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
