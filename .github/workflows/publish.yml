name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate release contract
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          if "${{ github.ref }}" != "refs/heads/main":
              raise SystemExit("release artifacts may be built only from main")

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          version = project["version"]
          if version != "0.2.0":
              raise SystemExit(f"expected release version 0.2.0, received {version!r}")

          init_text = Path("src/anyfileio/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if match is None or match.group(1) != version:
              raise SystemExit("pyproject.toml and anyfileio.__version__ disagree")

          extras = project.get("optional-dependencies", {})
          if set(extras) != {"dev", "gui"} or "semantics" in extras:
              raise SystemExit(f"unexpected release extras: {sorted(extras)!r}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if "## 0.2.0 - 2026-08-20" not in changelog:
              raise SystemExit("CHANGELOG.md is missing the final 0.2.0 release heading")
          PY
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import email
          import tarfile
          import zipfile
          from pathlib import Path

          version = "0.2.0"
          expected = [
              f"anyfileio-{version}-py3-none-any.whl",
              f"anyfileio-{version}.tar.gz",
          ]
          actual = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          if actual != expected:
              raise SystemExit(f"unexpected distribution set: {actual!r}; expected {expected!r}")

          forbidden = ("anygeometry", "anymesher", "anymaterial", "ocp", "cadquery")
          with zipfile.ZipFile(Path("dist", expected[0])) as archive:
              names = archive.namelist()
              metadata_name, = [name for name in names if name.endswith(".dist-info/METADATA")]
              metadata = email.message_from_bytes(archive.read(metadata_name))
              if metadata["Name"] != "ANYfileio" or metadata["Version"] != version:
                  raise SystemExit("wheel metadata does not match the release contract")
              requirements = metadata.get_all("Requires-Dist", [])
              runtime = [item for item in requirements if "extra ==" not in item]
              if runtime != ["numpy>=1.26"]:
                  raise SystemExit(f"unexpected runtime requirements: {runtime!r}")
              provides = set(metadata.get_all("Provides-Extra", []))
              if provides != {"dev", "gui"}:
                  raise SystemExit(f"unexpected provided extras: {sorted(provides)!r}")
              flattened = "\n".join(requirements).lower()
              if any(name in flattened for name in forbidden):
                  raise SystemExit("wheel metadata contains a deferred owner/provider")
              entry_points_name, = [
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              ]
              entry_points = archive.read(entry_points_name).decode("utf-8")
              for expected_entry in (
                  "anyfileio = anyfileio.__main__:main",
                  "anyfileio-gui = anyfileio.gui:main",
              ):
                  if expected_entry not in entry_points:
                      raise SystemExit(f"wheel is missing entry point {expected_entry!r}")

          with tarfile.open(Path("dist", expected[1]), "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              root = f"anyfileio-{version}"
              package_info = archive.extractfile(members[f"{root}/PKG-INFO"])
              if package_info is None:
                  raise SystemExit("sdist is missing readable PKG-INFO")
              metadata = email.message_from_binary_file(package_info)
              if metadata["Name"] != "ANYfileio" or metadata["Version"] != version:
                  raise SystemExit("sdist metadata does not match the release contract")
              for relative in ("LICENSE", "README.md", "CHANGELOG.md", "MIGRATION.md"):
                  if f"{root}/{relative}" not in members:
                      raise SystemExit(f"sdist is missing {relative}")
          PY
      - name: Upload checked artifacts for manual download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anyfileio-0.2.0-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
