[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The repository is ANYfileIO, but `anyio` on PyPI is the async compatibility
# library (a transitive dependency of httpx and starlette).  A top-level import
# package by that name would shadow it, so the distribution and import package
# are `ANYfileio`/`anyfileio`.
name = "ANYfileio"
version = "0.2.1"
description = "Reading and writing structural finite-element interchange files: SESAM FEM/SIF and CalculiX INP/FRD/DAT"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
# Records, documents, built-in formats, and CAD-neutral contracts are NumPy-only.
# Semantic mesh/material operations are available through the coordinated
# ``semantics`` extra; the base reader remains NumPy-only.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
semantics = [
  "ANYmesher>=0.3.2,<0.4",
  "ANYmaterial>=0.1.1,<0.2",
]
# The file inspector uses tkinter from the standard library, so it adds no
# wheel.  The extra exists so `pip install ANYfileio[gui]` is meaningful and
# stays meaningful if that ever stops being true.
gui = []
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

[project.scripts]
anyfileio = "anyfileio.__main__:main"

# A GUI entry point so no console window opens alongside the inspector.
[project.gui-scripts]
anyfileio-gui = "anyfileio.gui:main"

[project.urls]
Homepage = "https://github.com/audunarn/ANYfileIO"
Repository = "https://github.com/audunarn/ANYfileIO"
Issues = "https://github.com/audunarn/ANYfileIO/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyfileio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
# A repository-local basetemp, because the user temp directory is not always
# writable by the test process on Windows.  Gitignored, and pytest prunes it.
# tests/conftest.py assigns a unique, gitignored repository-local basetemp so
# concurrent runs never fight over one Windows directory.
addopts = ["-ra", "-p", "no:cacheprovider"]
